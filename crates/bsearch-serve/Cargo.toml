[package]
name = "bsearch-serve"
version.workspace = true
edition.workspace = true

[dependencies]
bsearch-core = { path = "../bsearch-core" }
anyhow.workspace = true
dirs.workspace = true
dotenvy.workspace = true
async-trait = "0.1.91"
atproto-jetstream = "0.14.5"
atrium-api = "0.25.8"
atrium-xrpc-client = "0.5.15"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ipld_dagcbor = "0.7.0"
sha2 = "0.11.0"
ipld-core = "0.4.3"
chrono.workspace = true
data-encoding = "2.11.1"
cid = "0.11.3"
multihash = "0.19.5"
tokio-websockets = { version = "0.13.3", features = ["client", "rustls-native-roots", "ring", "fastrand"] }
futures-util = "0.3.34"
http = "1.5.0"
urlencoding = "2.1.3"
thiserror = "2.0.20"
reqwest = { version = "0.12.28", features = ["json", "stream"] }

[dev-dependencies]
tempfile.workspace = true
# `test-util` gives the tests a paused clock, so the connection-lifetime
# watchdog can be exercised without waiting out its real timeout.
tokio = { version = "1.53.1", features = ["test-util"] }
