[package]
name = "bsearch-serve"
version.workspace = true
edition.workspace = true

[dependencies]
bsearch-core = { path = "../bsearch-core" }
anyhow.workspace = true
dirs.workspace = true
dotenvy.workspace = true
async-trait = "0.1.91"
atproto-jetstream = "0.14.5"
atrium-api = "0.25.8"
atrium-xrpc-client = "0.5.15"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile.workspace = true
# `test-util` gives the tests a paused clock, so the connection-lifetime
# watchdog can be exercised without waiting out its real timeout.
tokio = { version = "1.53.1", features = ["test-util"] }
