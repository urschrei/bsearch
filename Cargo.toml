[workspace]
members = ["crates/bsearch-core", "crates/bsearch-search", "crates/bsearch-serve"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
ndarray = "0.17"
# Default features include `download-binaries`, which fetches a prebuilt
# ONNX Runtime at build time and links it statically. This keeps the binaries
# self-contained: no ORT_DYLIB_PATH, no Homebrew libonnxruntime at runtime.
ort = "2.0.0-rc.12"
rusqlite = { version = "0.34", features = ["bundled", "load_extension"] }
sqlite-vec = "0.1"
tokenizers = "0.21"
dotenvy = "0.15"
dirs = "6"
chrono = "0.4"
tempfile = "3"
serial_test = "3"

[profile.release]
strip = true
lto = true
