[project]
name = "bsearch"
version = "0.1.0"
description = "Bluesky post and like monitor with vector search"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click",
    "atproto",
    "websockets",
    "sentence-transformers",
    "sqlite-vec",
    "numpy",
    "python-dotenv",
]

[project.scripts]
bsearch = "bsearch.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "onnxruntime>=1.24.4",
    "onnxscript>=0.6.2",
    "pytest",
    "pytest-asyncio",
]
